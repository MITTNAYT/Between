      <stop offset="0%" stopColor="#FFFFFF"/>
      <stop offset="100%" stopColor="#F5EFE7"/>
    </linearGradient>
    <linearGradient id="favLeftGrad" x1="28" y1="36" x2="68" y2="72" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#D94E34"/>
